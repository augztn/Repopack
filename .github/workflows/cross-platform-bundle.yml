name: Windows and Linux desktop builds 


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repopack-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    name: Build ${{ matrix.platform }} desktop package
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev
      - name: Install frontend dependencies
        run: npm install
      - name: Build native app bundles
        run: npm run tauri -- build
      - name: Collect platform packages
        shell: bash
        run: |
          set -euo pipefail
          source_dir="src-tauri/target/release/bundle"
          output_dir="package-out/${{ matrix.platform }}"
          if [ ! -d "$source_dir" ]; then
            echo "Expected Tauri bundle directory was not created: $source_dir"
            exit 1
          fi
          mkdir -p "$output_dir"
          cp -R "$source_dir"/. "$output_dir"/
          if [ -z "$(find "$output_dir" -type f -print -quit)" ]; then
            echo "No installer or application bundle files were produced."
            exit 1
          fi
      - name: Upload platform packages
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: repopack-${{ matrix.platform }}
          path: package-out/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 3

